[build]
  publish = "web_app/static"

# Proxies API and asset requests to the FastAPI backend (e.g. on Render)
[[redirects]]
  from = "/api/*"
  to = "https://suvarna-nadi-web.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://suvarna-nadi-web.onrender.com/assets/:splat"
  status = 200
  force = true

# SPA single-page fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
